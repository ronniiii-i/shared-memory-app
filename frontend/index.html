<!DOCTYPE html>
<html lang="en" data-theme="dark">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
      content="Memora is a shared place for the photographs, stories and voice notes you want to keep close. Start an album, invite your people, and relive the good stuff together." />
    <meta name="theme-color" content="#C85A32" />
    <meta name="color-scheme" content="dark light" />

    <title>Memora — Shared moments, kept close</title>


    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memora" />
    <meta property="og:title" content="Memora — Shared moments, kept close" />
    <meta property="og:description"
      content="A shared place for the photographs, stories and voice notes you want to keep close. Start an album, invite your people, and relive the good stuff together." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"
      content="Memora — the words 'Keep the moments that matter' over a warm collage of shared photographs." />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Memora — Shared moments, kept close" />
    <meta name="twitter:description"
      content="A shared place for the photographs, stories and voice notes you want to keep close." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Memora — 'Keep the moments that matter' over a collage of shared photographs." />

    <link rel="canonical" href="/" />

    <!-- Brand: installable app + home-screen icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Newsreader (Editorial Serif) + Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Patrick+Hand&family=Architects+Sister&family=Permanent+Marker&family=Gloria+Hallelujah&family=Pacifico&display=swap"
      rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="antialiased">
    <!-- App Shell -->
    <div id="app">
      <!-- Loading overlay -->
      <div id="app-loader" class="app-loader">
        <div class="loader-content">
          <img class="loader-logo" src="/memora-mark.png" alt="" width="96" height="96" />
          <h1 class="loader-title">Memora</h1>
          <div class="loader-spinner">
            <div class="spinner-ring"></div>
          </div>
          <p class="loader-subtitle">Gathering memories...</p>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Emoji Layer -->
    <div id="emoji-layer" class="emoji-layer"></div>


    <script>
      (function () {
        var origin = window.location.origin;
        var absolute = [
          ['meta[property="og:url"]', 'content'],
          ['meta[property="og:image"]', 'content'],
          ['meta[property="og:image:secure_url"]', 'content'],
          ['meta[name="twitter:image"]', 'content'],
          ['meta[name="twitter:url"]', 'content'],
          ['link[rel="canonical"]', 'href'],
          ['link[rel="manifest"]', 'href'],
          ['link[rel="apple-touch-icon"]', 'href']
        ];
        for (var i = 0; i < absolute.length; i++) {
          var el = document.head.querySelector(absolute[i][0]);
          if (!el) continue;
          var attr = absolute[i][1];
          var value = el.getAttribute(attr) || '';
          if (value.charAt(0) === '/') el.setAttribute(attr, origin + value);
        }
      })();
    </script>

    <!-- Main Entry Script -->
    <script type="module" src="/main.js"></script>
  </body>

</html>
